<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" role="img" aria-label="The StackFlow path: check your AI Visibility Score, follow your blueprint, then automations run for you">
<defs>
  <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00BFB3"/><stop offset="1" stop-color="#2DD4BF"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".45" r=".65">
    <stop offset="0" stop-color="#00BFB3" stop-opacity=".16"/><stop offset="1" stop-color="#00BFB3" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="460" height="560" fill="url(#glow)"/>

<!-- connector spine with numbered stops -->
<path d="M78 118 C 40 190, 60 210, 96 246 M78 388 C 50 340, 46 300, 78 268" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"/>
<g font-size="13" font-weight="800" text-anchor="middle">
  <circle cx="78" cy="96" r="15" fill="url(#fg)"/><text x="78" y="101" fill="#00151f">1</text>
  <circle cx="86" cy="258" r="15" fill="url(#fg)"/><text x="86" y="263" fill="#00151f">2</text>
  <circle cx="78" cy="410" r="15" fill="url(#fg)"/><text x="78" y="415" fill="#00151f">3</text>
</g>

<!-- CARD 1 — AI Visibility Score -->
<g transform="translate(108,28)">
  <rect width="330" height="136" rx="14" fill="#131E33" stroke="#2A4358"/>
  <text x="22" y="34" fill="#FFFFFF" font-size="14" font-weight="800">AI Visibility Score</text>
  <g transform="translate(52,86)">
    <circle r="32" fill="none" stroke="#1E293B" stroke-width="8"/>
    <circle r="32" fill="none" stroke="url(#fg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="157 201" transform="rotate(-90)"/>
    <text y="6" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="800">78</text>
  </g>
  <g font-size="12" font-family="Lato, 'Segoe UI', Arial, sans-serif">
    <path d="M110 62 l5 5 8-10" stroke="#26D07C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="71" fill="#C7D2E0">Found by ChatGPT</text>
    <path d="M110 88 l5 5 8-10" stroke="#26D07C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="97" fill="#C7D2E0">Reviews look strong</text>
    <circle cx="117" cy="112" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="134" y="117" fill="#94A3B8">2 gaps to fix</text>
  </g>
</g>

<!-- CARD 2 — Growth Blueprint -->
<g transform="translate(120,192)">
  <rect width="330" height="140" rx="14" fill="#131E33" stroke="#2A4358"/>
  <text x="22" y="34" fill="#FFFFFF" font-size="14" font-weight="800">Your Growth Blueprint</text>
  <g font-size="12" font-family="Lato, 'Segoe UI', Arial, sans-serif">
    <rect x="22" y="48" width="286" height="24" rx="7" fill="#0B1120" stroke="#1E293B"/>
    <path d="M34 60 l5 5 8-10" stroke="#26D07C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="64" fill="#C7D2E0">Pick your starter stack</text>
    <rect x="22" y="78" width="286" height="24" rx="7" fill="#0B1120" stroke="#1E293B"/>
    <path d="M34 90 l5 5 8-10" stroke="#26D07C" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="94" fill="#C7D2E0">Set up review requests</text>
    <rect x="22" y="108" width="286" height="24" rx="7" fill="#0B1120" stroke="#00BFB3"/>
    <circle cx="39" cy="120" r="6" fill="none" stroke="#00BFB3" stroke-width="2"/>
    <text x="56" y="124" fill="#FFFFFF">Automate lead follow-up</text>
    <text x="296" y="124" fill="#00BFB3" text-anchor="end" font-weight="700">→</text>
  </g>
</g>

<!-- CARD 3 — Automations running -->
<g transform="translate(108,360)">
  <rect width="330" height="150" rx="14" fill="#131E33" stroke="#2A4358"/>
  <text x="22" y="34" fill="#FFFFFF" font-size="14" font-weight="800">Automations</text>
  <rect x="234" y="18" width="76" height="24" rx="12" fill="#0B1120" stroke="#26D07C"/>
  <circle cx="250" cy="30" r="4" fill="#26D07C"/>
  <text x="260" y="34" fill="#26D07C" font-size="11" font-weight="700">Live</text>
  <!-- node flow -->
  <g transform="translate(22,56)">
    <rect width="64" height="44" rx="10" fill="#0B1120" stroke="#2DD4BF"/>
    <text x="32" y="20" text-anchor="middle" fill="#2DD4BF" font-size="10" font-weight="700">NEW LEAD</text>
    <rect x="14" y="27" width="36" height="5" rx="2.5" fill="#1E293B"/>
    <path d="M70 22 H104" stroke="#00BFB3" stroke-width="2"/><path d="M100 18 l8 4 -8 4z" fill="#00BFB3"/>
    <rect x="110" y="0" width="64" height="44" rx="10" fill="#0B1120" stroke="#2DD4BF"/>
    <text x="142" y="20" text-anchor="middle" fill="#2DD4BF" font-size="10" font-weight="700">BOOK CALL</text>
    <rect x="124" y="27" width="36" height="5" rx="2.5" fill="#1E293B"/>
    <path d="M180 22 H214" stroke="#00BFB3" stroke-width="2"/><path d="M210 18 l8 4 -8 4z" fill="#00BFB3"/>
    <rect x="220" y="0" width="64" height="44" rx="10" fill="url(#fg)"/>
    <text x="252" y="20" text-anchor="middle" fill="#00151f" font-size="10" font-weight="800">FOLLOW UP</text>
    <path d="M238 32 l6 5 12-12" stroke="#00151f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="22" y="132" fill="#94A3B8" font-size="12" font-family="Lato, 'Segoe UI', Arial, sans-serif">Runs while you work — <tspan fill="#2DD4BF" font-weight="700">14.5 hrs saved this week</tspan></text>
</g>
</svg>
